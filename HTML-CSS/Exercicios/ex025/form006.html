<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 06</title>
</head>
<body>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="idcor">Cor:</label>
            <input type="color" name="cor" id="idcor">
        </p>

        <p>
            <label for="idnivel">Nível de Satisfação</label>
            <input type="range" name="nivel" id="idnivel" min="1" max="5">
        </p>

        <p>
            <label for="idfoto">Foto do Perfil:</label>
            <input type="file" name="foto" id="idfoto">
        </p>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</body>
</html>
