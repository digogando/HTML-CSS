<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 03</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.php" method="get"></form>
    <p>
        <label for="idnome">Nome</label>
        <input type="text" name="nome" id="idnome" required maxlength="30"
        placeholder="Nome Completo" autocomplete="name" required>
    </p>
    <p>
        <label for="idmedia">Média</label>
        <input type="number" name="media" id="idmedia" min="0" max="10"
        placeholder="0 a 10" step="0.1" required>
    </p>
    <p>
        <label for="idmes">Período Letivo</label>
        <input type="month" name="mes" id="idmes">
    </p>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
</body>
</html>
