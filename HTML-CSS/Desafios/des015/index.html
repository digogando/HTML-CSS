<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-querys.css">
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">
                
            </div>
            <div id="formulario">
                <h1>Login</h1>
                    <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder
                    fazer as configuações no seu ambiente.</p>
                    <form action="login.php" method="post">
                        <div class="campo">
                            <i class="material-icons">person</i>
                            <label for="idlogin">Login</label>
                            <input type="email" name="login" id="idlogin" placeholder="Seu email" autocomplete="email" required maxlength="30">
                        </div>

                        <div class="campo">
                            <i class="material-icons">vpn_key</i>
                            <label for="idsenha">Senha</label>
                            <input type="password" name="senha" id="idsenha" placeholder="Sua senha" autocomplete="current-password" required minlength="8">
                        </div>
                    </form>
            </div>
            <input type="submit" value="Entrar">
            <a href="esqueci.html">
                Esqueci a senha <i class="material-icons">mail</i>
            </a>
        </section>
    </main>
</body>
</html>
